# Orders job: ORDERS (root), ORDER_DETAILS (1:1) and ORDER_LINE_ITEMS (1:N).
#
# Run either stage with -Dconfig.file=jobs/orders.conf (this file is also bundled in the jar and
# used when no config.file is given). Write its tables' DDL with:
#   scripts/cdc-model.sh ddl jobs/orders.conf
#
# The types reproduce the existing order_stream and orders_current tables: numbers as double,
# dates and timestamps as the GoldenGate strings. Shared settings (Kafka servers, metadata topic,
# checkpoint root, dropped events, ordering) come from cdc-defaults.conf in the jar.

job {
  name = orders

  model.entities = [
    {
      name = orders
      role = root
      table = ORDERS
      topic = "dev.appuser.orders.json"
      key = ORDER_ID
      version = VERSION
      columns = [
        { source = ORDER_ID,            name = orderId,           type = double }
        { source = ORDER_REF,           name = orderRef,          type = string }
        { source = VERSION,             name = version,           type = double }
        { source = ORDER_DATE,          name = orderDate,         type = string }
        { source = ORDER_TS,            name = orderTs,           type = string }
        { source = ORDER_STATUS,        name = orderStatus,       type = string }
        { source = ORDER_TYPE,          name = orderType,         type = string }
        { source = TOTAL_AMOUNT,        name = totalAmount,       type = double }
        { source = CURRENCY,            name = currency,          type = string }
        { source = CUSTOMER_ID,         name = customerId,        type = string }
        { source = SHIPPING_ADDRESS_ID, name = shippingAddressId, type = string }
        { source = CREATED_TS,          name = createdTs,         type = string }
      ]
    }
    {
      name = orderDetails
      table = ORDER_DETAILS
      topic = "dev.appuser.order_details.json"
      cardinality = one
      root-key = ORDER_ID
      version = VERSION
      columns = [
        { source = ORDER_ID,                name = orderId,               type = double }
        { source = VERSION,                 name = version,               type = double }
        { source = SHIPPING_METHOD,         name = shippingMethod,        type = string }
        { source = TRACKING_NUMBER,         name = trackingNumber,        type = string }
        { source = SHIPPED_TS,              name = shippedTs,             type = string }
        { source = ESTIMATED_DELIVERY_DATE, name = estimatedDeliveryDate, type = string }
        { source = CARRIER,                 name = carrier,               type = string }
        { source = DELIVERY_STATUS,         name = deliveryStatus,        type = string }
      ]
    }
    {
      name = lineItems
      table = ORDER_LINE_ITEMS
      topic = "dev.appuser.order_line_items.json"
      cardinality = many
      root-key = ORDER_ID
      key = LINE_ITEM_ID
      version = VERSION
      columns = [
        { source = LINE_ITEM_ID,  name = lineItemId,   type = double }
        { source = ORDER_ID,      name = orderId,      type = double }
        { source = VERSION,       name = version,      type = double }
        { source = PRODUCT_ID,    name = productId,    type = string }
        { source = ITEM_QTY,      name = itemQty,      type = double }
        { source = ITEM_PRICE,    name = itemPrice,    type = double }
        { source = ITEM_AMOUNT,   name = itemAmount,   type = double }
        { source = ITEM_CURRENCY, name = itemCurrency, type = string }
      ]
    }
  ]

  output {
    stream {
      table = "mymanaged.argus1.order_stream"
      # checkpoint = "/tmp/spark-checkpoints/orders/stream"     (default: <checkpoint-root>/<job>/stream)
    }
    current {
      table = "mymanaged.argus1.orders_current"
      root-before = orderBefore
      # checkpoint = "/tmp/spark-checkpoints/orders/current"    (default: <checkpoint-root>/<job>/current)
    }
    # transform = com.example.OrdersTransform                   (optional, for derived columns)
  }
}
