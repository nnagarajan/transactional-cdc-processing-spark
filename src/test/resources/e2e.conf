# End-to-end suites (docs/E2E-TESTING.md). Every key can be overridden with -D<key>=<value>,
# for example -De2e.correctness.sessions=12. Spark and Unity Catalog settings come from
# reference.conf (spark.unity-catalog.*).
include "reference"

e2e {
  oracle {
    url = "jdbc:oracle:thin:@//localhost:1521/ORCLPDB"
    # Local development database only: never point the suites at a shared database with these.
    # E2E_ORACLE_USER and E2E_ORACLE_PASSWORD override them, and -D overrides both.
    user = "appuser"
    password = "appuser"
  }

  tables {
    schema = "argus1"
    order-stream = "order_stream"
    orders-current = "orders_current"
    dropped-events = "dropped_events"
  }

  # Seed for session counts and workloads; 0 picks one from the clock (printed in the report)
  seed = 0

  poll-interval = 2 seconds
  preflight-timeout = 3 minutes
  catch-up-timeout = 10 minutes
  report-dir = "target/e2e-reports"

  correctness {
    # 0 = choose 10..20 from the seed
    sessions = 0
    tx-per-session = 40
    hot-orders = 5
    # Relative weights of the transaction kinds (design.md D8)
    weights {
      INSERT_ONE = 25
      INSERT_MULTI = 10
      UPDATE_OWN = 20
      UPDATE_HOT = 20
      CHILD_ONLY = 15
      ROLLBACK = 10
    }
  }

  performance {
    sessions = 16
    events-per-minute = 100000
    duration = 300 seconds
    # Relative weights of the sustained-phase flavors (F6 runs in the bulk phase)
    mix {
      F1 = 20
      F2 = 35
      F3 = 25
      F4 = 5
      F5 = 2
      F7 = 13
    }
    bulk {
      orders = 10000
      orders-per-tx = 100
      sessions = 10
    }
    # Optional thresholds: when set, exceeding them fails the run. Example: 20 seconds
    # max-p95-processed-latency = 20 seconds
    # max-catch-up = 60 seconds
  }

  latency {
    orders = 200
    interval = 500 milliseconds
  }
}
