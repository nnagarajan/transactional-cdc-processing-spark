# Shared infrastructure defaults for every CDC job (included by reference.conf). A job's own
# config (jobs/<job>.conf) states its input and output; see docs/ADDING-A-JOB.md.
job {
  kafka {
    bootstrap-servers = "localhost:9092"
    # Transaction markers (single partition, commit order), shared by every job
    metadata-topic = "dev.transaction_metadata_json"

    # Per-source starting position, used only on a new checkpoint (see the go-live runbook in
    # gg-configs/README.md). Keyed by entity name, or transaction-metadata. Each value is
    # "earliest", "latest", or a JSON map of partition to offset; a source without a key uses
    # kafka.starting-offsets.
    # starting-offsets {
    #   orders = """{"0":12345}"""
    #   transaction-metadata = "earliest"
    # }
  }

  source {
    # Format of GoldenGate DATE and TIMESTAMP values, for columns of type date or timestamp
    timestamp-format = "yyyy-MM-dd HH:mm:ss[.SSSSSSSSS]"
  }

  output {
    # Each stage's checkpoint defaults to <checkpoint-root>/<job name>/<stream|current>
    checkpoint-root = "/tmp/spark-checkpoints"

    # One row per discarded input, with the reason (db/create_dropped_events_table.deltalake.sql);
    # shared by every job, each row names its job
    dropped-events {
      # false: drops are only logged, and the table need not exist
      enabled = true
      table-name = "mymanaged.argus1.dropped_events"
      # full: one row per replayed event or marker; summary: one row per replayed transaction
      replay-detail = "full"
    }
  }

  ordering {
    # Log an error when the head-of-line transaction has blocked emission this long
    blocked-alert-threshold = 10 minutes
    # How often a blocked head is re-checked when no new input arrives
    check-interval = 1 minute
    # Micro-batch trigger interval. Required: without it the stateful operator runs empty
    # batches back to back (Spark 4.x transformWithState in processing-time mode).
    trigger-interval = 10 seconds
  }
}
