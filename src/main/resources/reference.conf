# Shared defaults for all jobs
spark {
  dev {
    master = "local[*]"
    app-name = "dev-launch"
  }

  extensions {
    sql-extensions = "io.delta.sql.DeltaSparkSessionExtension"
    catalog = "org.apache.spark.sql.delta.catalog.DeltaCatalog"
  }

  state-store.provider-class = "org.apache.spark.sql.execution.streaming.state.RocksDBStateStoreProvider"

  resources {
    executor-memory = "1G"
    driver-memory = "1G"
    driver-cores = 4
  }

  ui-port = "4041"
  warehouse-dir = "/tmp/warehouse/sql2"

  unity-catalog {
    catalog-class = "io.unitycatalog.spark.UCSingleCatalog"
    uri = "http://localhost:7071"
    auth-type = "static"
    auth-token = "dummy"
    # Catalog with a storage root, so tables are Unity Catalog managed (no LOCATION needed)
    catalog-name = "mymanaged"
    credential-vending = false
  }

  log-level = "WARN"
}

kafka {
  starting-offsets = "earliest"
  fail-on-data-loss = true
}
