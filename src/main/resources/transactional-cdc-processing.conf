include "reference"

job {
  name = "transactional-cdc-processing"

  kafka {
    bootstrap-servers = "localhost:9092"

    topics {
      orders = "dev.appuser.orders.json"
      order-details = "dev.appuser.order_details.json"
      order-line-items = "dev.appuser.order_line_items.json"
      transaction-metadata = "dev.transaction_metadata_json"
    }
  }

  output {
    # New path: the ordered sequencer's state is incompatible with earlier checkpoints
    checkpoint-location = "/tmp/spark-checkpoints-ordered"
    delta-table-name = "argus1.order_stream"
  }

  ordering {
    # Log an error when the head-of-line transaction has blocked emission this long
    blocked-alert-threshold = 10 minutes
    # How often a blocked head is re-checked when no new input arrives
    check-interval = 1 minute
    # Micro-batch trigger interval. Required: without it the stateful operator runs empty
    # batches back to back (Spark 4.0 transformWithState in processing-time mode).
    trigger-interval = 10 seconds
  }
}
